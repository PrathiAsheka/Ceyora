<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Monthly Report</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; color: #333; }
        h1 { color: #1a54e1; border-bottom: 2px solid #1a54e1; padding-bottom: 10px; }
        h2 { color: #333; margin-top: 30px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        table { width: 100%; border-collapse: collapse; margin: 15px 0; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f5f5f5; font-weight: bold; }
        .kpi-grid { display: flex; flex-wrap: wrap; gap: 10px; margin: 15px 0; }
        .kpi { flex: 1; min-width: 150px; padding: 15px; background: #f8f9fa; border-radius: 8px; text-align: center; }
        .kpi-value { font-size: 24px; font-weight: bold; color: #1a54e1; }
        .kpi-label { font-size: 12px; color: #666; margin-top: 5px; }
        .alert { padding: 10px; margin: 5px 0; border-radius: 4px; }
        .alert-warning { background: #fff3cd; border: 1px solid #ffc107; }
        .alert-danger { background: #f8d7da; border: 1px solid #dc3545; }
        .footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid #eee; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
    <div class="footer">
        <p>Generated by Ceyora - Tuition BI & Operations Platform</p>
        <p>{{ generated_date }}</p>
    </div>
</body>
</html>
